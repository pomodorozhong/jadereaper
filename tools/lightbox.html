<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbox</title>
<style>
/* Layout: header bar, then a step rail with that step's controls on the left and the working view on the right */
:root{--bg:#e4e6dc;--panel:#f3f4ee;--stage:#cfd4c2;--fg:#24261f;--muted:#5d6153;--accent:#3f7a5e;--accent-fg:#fff;--line:#c2c7b4;--warn:#a2462e;
--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e19;--panel:#24281f;--stage:#30352b;--fg:#e6e8de;--muted:#a3a896;--accent:#7cc39e;--accent-fg:#13241b;--line:#3d4237;--warn:#e08a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1e19;--panel:#24281f;--stage:#30352b;--fg:#e6e8de;--muted:#a3a896;--accent:#7cc39e;--accent-fg:#13241b;--line:#3d4237;--warn:#e08a6c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--body);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 8px 0 0}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 9px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:320px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.parts{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.parts[hidden]{display:none}
.parts .tabs{display:flex;flex-wrap:wrap;gap:4px}
.parts .tabs button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.parts .tabs button .sw{display:inline-block;width:.7em;height:.7em;border-radius:2px;margin-right:5px;vertical-align:-1px}
.parts .fields{display:grid;grid-template-columns:auto 1fr auto 4.5em;gap:6px;align-items:center}
.parts .fields input{min-width:0;width:100%}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps button{width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:5px;display:flex;gap:8px}
ol.steps button .n{color:var(--muted);font-variant-numeric:tabular-nums;width:1.4em}
ol.steps button.cur{background:var(--accent);color:var(--accent-fg)}
ol.steps button.cur .n{color:inherit}
.params{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.params h2{font-size:13px;margin:0}
.params p.help{margin:0;color:var(--muted)}
.p label{display:flex;justify-content:space-between;gap:8px}
.p label output{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.p input[type=range]{width:100%;accent-color:var(--accent)}
.p .hint{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:6px;align-items:center}
main{flex:1;min-width:0;position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{position:relative;max-width:100%;max-height:100%;transform-origin:0 0}
#zoombar{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}
#zoombar button{background:var(--panel);font-family:var(--mono);font-size:12px;min-width:30px}
#view canvas[data-cursor=none]{cursor:none}
#view canvas[data-cursor=crosshair]{cursor:crosshair}
main.panning,main.panning #view canvas{cursor:grab}
#view canvas{display:block;touch-action:none}
#view canvas.px{image-rendering:pixelated}
#view svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.empty{text-align:center;color:var(--muted);max-width:40ch;padding:24px;border:2px dashed var(--line);border-radius:10px}
#status{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:4px}
#view svg#brushCursor{z-index:2;overflow:visible}
#brushCursor path{fill:none;stroke-linecap:square}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:50vh}}
</style>
</head>
<body>
<header>
  <h1>Lightbox</h1>
  <div class="grp"><label for="file">Photo</label><input type="file" id="file" accept="image/*"></div>
  <div class="grp">
    <label for="presetName">Character</label>
    <input type="text" id="presetName" placeholder="e.g. reaper" size="12">
    <button id="savePreset" title="Keep this character's parts and settings in this browser">Save character</button>
    <select id="presetList" aria-label="Saved characters"><option value="">Load saved…</option></select>
    <button id="exportPreset" title="Download <name>.preset.json: the settings, and each part's lassos, fill brush and pivot">Download preset</button>
    <button id="importPresetBtn" title="Open a <name>.preset.json">Open preset</button><input type="file" id="importPreset" accept=".json" hidden>
    <button id="debugLog" title="Download a report of recent line-editor activity, to send with a bug">Save debug log</button>
  </div>
</header>
<div class="wrap">
  <aside>
    <ol class="steps" id="steps"></ol>
    <div class="parts" id="parts" hidden></div>
    <div class="params" id="params"></div>
  </aside>
  <main id="main">
    <div class="empty" id="empty">Open a photo or scan of a drawing (or drop it here).<br>Then go through the steps on the left: clean up and trace the whole character first, then split it into parts.</div>
    <div id="view" hidden><canvas id="cv"></canvas><svg id="brushCursor" style="display:none"></svg></div>
    <div id="status"></div>
    <div id="zoombar" hidden><button id="zOut" title="Zoom out (-)">−</button><button id="zFit" title="Fit to the view (0)">100%</button><button id="zIn" title="Zoom in (=)">+</button></div>
  </main>
</div>
<script>
'use strict';
// ====================================================================
// Settings. Each parameter knows which pipeline stage it invalidates.
// Stages: 0 source, 1 paper, 2 ink, 3 fill, 4 solid, 5 strokes, 6 parts (7 = view only)
// ====================================================================
const DEFAULTS = {
  rotate: 0, crop: null, maxSize: 900,
  // Tuned on the artist's pencil photos: clean, smooth lines rather than a copy of every pencil wobble.
  bgOn: true, bgClose: 30, bgBlur: 150,
  lo: 20, hi: 60, cut: 0.35, speck: 20,   // lo and hi at these values mean "not set yet": auto levels runs on load
  fillClose: 10, fillOpen: 0,
  lineBlur: 0.5, lineT: 0.15, minLen: 7, burrLen: 5, extendLen: 6, smooth: 6, simplify: 3, widthScale: 1, overlapLen: 6.5, joinGap: 3, joinAngle: 40, solidK: 2.2, solidMin: 5, solidDepth: 1, solidClose: 1.5, fillSmooth: 4.5,
  boilAmp: 0.9, boilFps: 4, boilPoses: 6,
  edits: [],   // brush edits: {layer:'ink'|'fill', mode:'add'|'erase', r, pts:[[x,y]...]} in rotated-source pixels
  // line edits on the strokes step, in rotated-source pixels: {from: the traced line it replaces, nodes:
  // [{p, i, o}] cubic bezier anchors with in and out handles, closed} or {from, del: true} for a deleted line
  curves: [],
};
let S = structuredClone(DEFAULTS);   // one set of settings for the whole character
// Parts split the traced character. marks: {kind:'lasso', pts} regions and {kind:'fill', mode, r, pts} paper brush
// strokes, in rotated-source pixels. Pixels outside every lasso belong to the first part.
const newPart = (id, z) => ({ id, z, pivot: null, marks: [] });
let CH = { parts: [newPart('body', 0)] }, cur = 0;   // the character being traced
const PART_COLORS = ['#d9822b', '#3f7ab8', '#5f9e3a', '#b8487a', '#8a62c4', '#2b9c94', '#c4a92b', '#a0522d'];
const partColor = (i) => PART_COLORS[i % PART_COLORS.length];
const PART = () => CH.parts[cur];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const STEPS = [
  { id: 'source', name: 'Source', stage: 0, help: 'Rotate the page and drag a box around ONE character. Everything after works on that box.',
    params: [['rotate', 'Rotate', 'rot'], ['maxSize', 'Working size (px, long side)', 300, 1600, 50, 0]] },
  { id: 'paper', name: 'Paper', stage: 1, help: 'Removes uneven lighting and paper colour. The view should look like even white paper with grey lines.',
    params: [['bgOn', 'Flatten lighting', 'bool', 1], ['bgClose', 'Line removal size', 1, 60, 1, 1, 'Larger than the thickest line. Too small leaves lines in the light estimate.'], ['bgBlur', 'Lighting smoothness', 5, 300, 1, 1]] },
  { id: 'ink', name: 'Ink', stage: 2, brush: 'ink', help: 'Picks which pixels are pencil. Paint with the brush to add missed lines or erase smudges, specks and stray marks.',
    params: [['lo', 'Paper level (below = paper)', 0, 120, 1, 2], ['hi', 'Full ink level', 1, 200, 1, 2], ['cut', 'Line cut-off', 0.05, 0.9, 0.01, 2], ['speck', 'Remove specks smaller than (px)', 0, 400, 1, 2], ['auto', 'Auto levels', 'btn']] },
  { id: 'fill', name: 'Paper fill', stage: 3, brush: 'fill', help: 'The white cutout under the drawing. Raise gap closing if it leaks inside, or paint/erase the fill directly. Erasing fill never removes the ink lines under it.',
    params: [['fillClose', 'Gap closing (px)', 1, 60, 1, 3], ['fillOpen', 'Trim thin bits (px)', 0, 10, 1, 3]] },
  { id: 'solid', name: 'Solid ink', stage: 4, brush: 'solid', help: 'Areas coloured in solid (shoes, ear insides, a nose) become filled shapes, decided here before any strokes are traced. Shown in orange. Paint or erase to fix them.',
    params: [['solidK', 'Solid if thicker than × line', 1.2, 6, 0.1, 4, 'Lower finds more solid areas; higher only the boldest.'], ['solidDepth', 'Must be this much thicker than the cut-off × line', 0, 4, 0.1, 4, 'Rejects thick junctions and doubled lines.'], ['solidMin', 'Ignore solid areas smaller than × line', 1, 20, 0.5, 4], ['solidClose', 'Fill pencil gaps inside solids (px)', 0, 6, 0.5, 4]] },
  { id: 'strokes', name: 'Strokes', stage: 5, help: 'Traces the remaining lines as centerline strokes, all the same width. Where two strokes would lie on top of each other, the shorter one is cut back, and pieces of one line that meet or carry on in the same direction are joined into one stroke. With the photo underneath, strokes are blue. Click a line or a solid ink shape to reshape it as a bezier curve, or draw new ones with the tools below; your edits stay when you change the sliders.',
    params: [['lineBlur', 'Merge pencil grain', 0, 4, 0.1, 5], ['lineT', 'Line threshold', 0.05, 0.6, 0.01, 5], ['widthScale', 'Line width (× drawn line)', 0.4, 3, 0.05, 5], ['overlapLen', 'Remove doubled lines longer than × width', 1, 15, 0.5, 5, 'Where two strokes run side by side for longer than this, the shorter is cut.'], ['joinGap', 'Join line ends closer than × width', 0, 10, 0.5, 5, 'Where one line stops and another carries on in the same direction, they become one stroke.'], ['joinAngle', 'Join only if the line turns less than (°)', 5, 90, 1, 5], ['extendLen', 'Extend line ends to meet a line within × width', 0, 15, 0.5, 5, 'A line that stops just short of the line it heads for is carried on to meet it.'], ['minLen', 'Drop strokes shorter than', 0, 60, 1, 5], ['burrLen', 'Remove burrs shorter than × width', 0, 12, 0.5, 5, 'A short stroke that sticks out of, or runs along, a longer line is a burr from a ragged pencil line.'], ['smooth', 'Smoothing', 0, 8, 0.1, 5], ['simplify', 'Simplify (bezier fit, px)', 0.1, 6, 0.05, 5, 'How far each traced curve may stray from the pencil line. Lower keeps more detail but gives more anchors to edit.'], ['fillSmooth', 'Fill outline smoothing', 0, 8, 0.5, 5], ['overlay', 'Show photo underneath', 'view'], ['curve', '', 'curve']] },
  { id: 'parts', name: 'Parts', stage: 6, help: 'Splits the clean drawing into parts that move on their own. Draw a lasso around each part; anything outside every lasso belongs to the first part, and a stroke that crosses a lasso is cut there. Where a part covers another, paint extra paper fill under it with the fill brush, so no hole shows when it moves.',
    params: [['parttools', '', 'parttools']] },
  { id: 'boil', name: 'Boil & export', stage: 6, help: 'Each stroke is redrawn per pose with its own wobble, as the game will bake it. Set each part\'s pivot, then export the whole character.',
    params: [['boilAmp', 'Boil strength', 0, 4, 0.1, 7], ['boilFps', 'Frames per second', 2, 24, 1, 7], ['boilPoses', 'Poses in cycle', 2, 6, 1, 7], ['pivot', '', 'pivot'], ['export', '', 'export']] },
];
const STAGE_OF = {};
for (const st of STEPS) for (const p of st.params) if (typeof p[2] === 'number') STAGE_OF[p[0]] = p[5]; else if (p[2] === 'bool') STAGE_OF[p[0]] = p[3];
STAGE_OF.rotate = 0;

// ====================================================================
// Image helpers (plain JS, no libraries)
// ====================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function slideExtreme(src, w, h, r, isMax) { // separable square max/min filter, monotonic deque, O(n)
  if (r < 1) return src.slice();
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const q = new Int32Array(Math.max(w, h) + 2 * r + 2);
  const better = isMax ? (a, b) => a >= b : (a, b) => a <= b;
  const pass = (inp, outp, n, m, stride, step) => {
    for (let j = 0; j < m; j++) {
      const base = j * stride;
      let head = 0, tail = 0;
      for (let i = -r; i < n; i++) {
        const k = i + r;
        if (k < n) {
          const v = inp[base + k * step];
          while (tail > head && better(v, inp[base + q[tail - 1] * step])) tail--;
          q[tail++] = k;
        }
        if (q[head] < i - r) head++;
        if (i >= 0) outp[base + i * step] = inp[base + q[head] * step];
      }
    }
  };
  pass(src, tmp, w, h, w, 1);
  pass(tmp, out, h, w, 1, w);
  return out;
}

function boxBlur(src, w, h, r) {
  r = Math.round(r);
  if (r < 1) return src.slice();
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const pass = (inp, outp, n, m, stride, step) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < m; j++) {
      const b = j * stride;
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += inp[b + clamp(k, 0, n - 1) * step];
      for (let i = 0; i < n; i++) {
        outp[b + i * step] = acc * inv;
        acc += inp[b + clamp(i + r + 1, 0, n - 1) * step] - inp[b + clamp(i - r, 0, n - 1) * step];
      }
    }
  };
  pass(src, tmp, w, h, w, 1);
  pass(tmp, out, h, w, 1, w);
  return out;
}
function gauss(src, w, h, sigma) { // three box passes ~ gaussian
  if (sigma <= 0.3) return src.slice();
  const r = Math.max(1, Math.round(Math.sqrt((12 * sigma * sigma) / 3 + 1) / 2 - 0.5 + 0.5));
  return boxBlur(boxBlur(boxBlur(src, w, h, r), w, h, r), w, h, r);
}

// Exact Euclidean distance transform (Felzenszwalb). Returns distance from each pixel to the nearest pixel where mask==0.
function edt(mask, w, h) {
  const INF = 1e20, f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
  const v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1);
  const g = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = mask[i] ? INF : 0;
  const tr = (n) => {
    let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  };
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; tr(h); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; tr(w); for (let x = 0; x < w; x++) g[y * w + x] = d[x]; }

  for (let i = 0; i < w * h; i++) out[i] = Math.sqrt(g[i]);
  return out;
}
const not = (m) => { const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = m[i] ? 0 : 1; return o; };
function dilate(m, w, h, r) { if (r <= 0) return m.slice(); const d = edt(not(m), w, h); const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = d[i] <= r ? 1 : 0; return o; }
function erode(m, w, h, r) { if (r <= 0) return m.slice(); const d = edt(m, w, h); const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = d[i] > r ? 1 : 0; return o; }

function components(m, w, h) { // 8-connected labels and areas
  const lab = new Int32Array(w * h), areas = [0], stack = new Int32Array(w * h);
  let n = 0;
  for (let i = 0; i < w * h; i++) {
    if (!m[i] || lab[i]) continue;
    n++; let sp = 0, a = 0; stack[sp++] = i; lab[i] = n;
    while (sp) {
      const p = stack[--sp]; a++;
      const x = p % w, y = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (m[q] && !lab[q]) { lab[q] = n; stack[sp++] = q; }
      }
    }
    areas.push(a);
  }

}
function dropSmall(m, w, h, minA) {
  if (minA <= 1) return m.slice();
  const { lab, areas } = components(m, w, h);
  const o = new Uint8Array(m.length);

}
function outsideFlood(blocked, w, h) { // pixels reachable from the border without crossing `blocked`
  const out = new Uint8Array(w * h), st = new Int32Array(w * h); let sp = 0;
  const push = (p) => { if (!blocked[p] && !out[p]) { out[p] = 1; st[sp++] = p; } };

  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }

    const p = st[--sp], x = p % w, y = (p / w) | 0;
    if (x > 0) push(p - 1); if (x < w - 1) push(p + 1); if (y > 0) push(p - w); if (y < h - 1) push(p + w);
  }
  return out;
}

function thin(m, w, h) { // Zhang-Suen thinning
  const s = m.slice();
  for (let x = 0; x < w; x++) { s[x] = 0; s[(h - 1) * w + x] = 0; }
  for (let y = 0; y < h; y++) { s[y * w] = 0; s[y * w + w - 1] = 0; }
  const del = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (let iter = 0; iter < 2; iter++) {
      del.length = 0;
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x; if (!s[i]) continue;
        const p2 = s[i - w], p3 = s[i - w + 1], p4 = s[i + 1], p5 = s[i + w + 1], p6 = s[i + w], p7 = s[i + w - 1], p8 = s[i - 1], p9 = s[i - w - 1];
        const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
        if (B < 2 || B > 6) continue;
        const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (A !== 1) continue;
        if (iter === 0 ? (p2 * p4 * p6 || p4 * p6 * p8) : (p2 * p4 * p8 || p2 * p6 * p8)) continue;
        del.push(i);
      }
      for (const i of del) s[i] = 0;
      if (del.length) changed = true;
    }
  }
  return s;
}

// Skeleton -> polylines (node to node, plus closed loops)
function skeletonPaths(sk, w, h) {
  const NB = [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1];
  const nbrs = (p) => { const o = []; for (const d of NB) if (sk[p + d]) o.push(p + d); return o; };
  const deg = new Map(), nodes = new Set();
  for (let i = 0; i < w * h; i++) if (sk[i]) { const d = nbrs(i).length; deg.set(i, d); if (d !== 2) nodes.add(i); }
  const used = new Set();
  const key = (a, b) => (a < b ? a * 4194304 + b : b * 4194304 + a);
  const paths = [];
  const walk = (start, nxt) => {
    const path = [start, nxt]; used.add(key(start, nxt));
    let prev = start, cur = nxt;
    while (!nodes.has(cur)) {
      const cand = nbrs(cur).filter((q) => q !== prev && !used.has(key(cur, q)));
      if (!cand.length) break;
      cand.sort((a, b) => Math.abs(a - cur) === 1 || Math.abs(a - cur) === w ? -1 : 1);
      const q = cand[0]; used.add(key(cur, q)); path.push(q); prev = cur; cur = q;
      if (cur === start) break;
    }

window.addEventListener('keydown', (ev) => { if (img && STEPS[step].id === 'strokes' && !typing(ev.target)) dbg('key', { key: ev.key, alt: ev.altKey, shift: ev.shiftKey, meta: ev.metaKey || ev.ctrlKey, sel: selInfo() }); }, true);
window.addEventListener('error', (e) => anomaly('page error', { message: e.message, at: `${e.lineno}:${e.colno}` }));
function debugReport() {
  const fileName = $('file').files && $('file').files[0] ? $('file').files[0].name : null;
  return {
    build: LIGHTBOX_BUILD, saved: new Date().toISOString(), userAgent: navigator.userAgent,
    viewport: [innerWidth, innerHeight], devicePixelRatio, image: img ? { name: fileName, size: [img.naturalWidth, img.naturalHeight] } : null,
    character: $('presetName').value, step: STEPS[step].id, tool: curveTool, zoom, pan: [panX, panY], screenPxPerWorkPx: r2(1 / pxToWork()),
    working: W.w ? { w: W.w, h: W.h, crop: [W.cx, W.cy, W.cw, W.ch], scale: W.scale, lineWidth: W.fig && W.fig.width } : null,
    selection: selInfo(true), drawnAnchors: svgEl ? svgEl.querySelectorAll('.anchor').length : 0,
    lines: (W.lines || []).map((l) => ({ curve: l.curve ?? null, closed: l.closed, n: l.nodes ? l.nodes.length : null, from: pt(l.pts[0]), to: pt(l.pts[l.pts.length - 1]) })),
    solids: (W.solids || []).map((l) => ({ curve: l.curve ?? null, n: l.nodes ? l.nodes.length : null, at: pt(l.pts[0]) })),
    settings: S, parts: CH, curveUndo: curveUndo.map((j) => JSON.parse(j)), curveRedo: curveRedo.map((j) => JSON.parse(j)),
    anomalies: DBG.anomalies, events: DBG.events,
  };
}
$('debugLog').onclick = () => {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '').replace('T', '-');
  download(`lightbox-debug-${stamp}.json`, JSON.stringify(debugReport(), null, 1), 'application/json');
  status(`Saved lightbox-debug-${stamp}.json (${DBG.events.length} events, ${DBG.anomalies.length} failed checks)`);
};
refreshPresetList(); renderParts(); renderSteps(); renderParams();
window.__lightbox = { get S() { return S; }, get CH() { return CH; }, W, ensure, loadFile, buildCharacter, selectPart, setStep: (i) => { step = i; renderSteps(); renderParams(); draw(); }, debugReport };
</script>
