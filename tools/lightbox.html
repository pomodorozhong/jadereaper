<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbox</title>
<style>
/* Layout: header bar, then a step rail with that step's controls on the left and the working view on the right */
:root{--bg:#e4e6dc;--panel:#f3f4ee;--stage:#cfd4c2;--fg:#24261f;--muted:#5d6153;--accent:#3f7a5e;--accent-fg:#fff;--line:#c2c7b4;--warn:#a2462e;
--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e19;--panel:#24281f;--stage:#30352b;--fg:#e6e8de;--muted:#a3a896;--accent:#7cc39e;--accent-fg:#13241b;--line:#3d4237;--warn:#e08a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1e19;--panel:#24281f;--stage:#30352b;--fg:#e6e8de;--muted:#a3a896;--accent:#7cc39e;--accent-fg:#13241b;--line:#3d4237;--warn:#e08a6c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--body);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 8px 0 0}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 9px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:320px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.parts{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.parts[hidden]{display:none}
.parts .tabs{display:flex;flex-wrap:wrap;gap:4px}
.parts .tabs button.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.parts .tabs button .sw{display:inline-block;width:.7em;height:.7em;border-radius:2px;margin-right:5px;vertical-align:-1px}
.parts .fields{display:grid;grid-template-columns:auto 1fr auto 4.5em;gap:6px;align-items:center}
.parts .fields input{min-width:0;width:100%}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps button{width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:5px;display:flex;gap:8px}
ol.steps button .n{color:var(--muted);font-variant-numeric:tabular-nums;width:1.4em}
ol.steps button.cur{background:var(--accent);color:var(--accent-fg)}
ol.steps button.cur .n{color:inherit}
.params{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.params h2{font-size:13px;margin:0}
.params p.help{margin:0;color:var(--muted)}
.p label{display:flex;justify-content:space-between;gap:8px}
.p label output{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.p input[type=range]{width:100%;accent-color:var(--accent)}
.p .hint{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:6px;align-items:center}
main{flex:1;min-width:0;position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{position:relative;max-width:100%;max-height:100%;transform-origin:0 0}
#zoombar{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}
#zoombar button{background:var(--panel);font-family:var(--mono);font-size:12px;min-width:30px}
main.panning,main.panning canvas{cursor:grab}
#view canvas{display:block;touch-action:none}
#view svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.empty{text-align:center;color:var(--muted);max-width:40ch;padding:24px;border:2px dashed var(--line);border-radius:10px}
#status{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:4px}
#brushCursor{position:fixed;pointer-events:none;border:1.5px solid var(--warn);border-radius:50%;display:none;z-index:5}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:50vh}}
</style>
</head>
<body>
<header>
  <h1>Lightbox</h1>
  <div class="grp"><label for="file">Photo</label><input type="file" id="file" accept="image/*"></div>
  <div class="grp">
    <label for="presetName">Character</label>
    <input type="text" id="presetName" placeholder="e.g. reaper" size="12">
    <button id="savePreset" title="Keep this character's parts and settings in this browser">Save character</button>
    <select id="presetList" aria-label="Saved characters"><option value="">Load saved…</option></select>
    <button id="exportPreset" title="Download <name>.preset.json: the settings, and each part's lassos, fill brush and pivot">Download preset</button>
    <button id="importPresetBtn" title="Open a <name>.preset.json">Open preset</button><input type="file" id="importPreset" accept=".json" hidden>
  </div>
</header>
<div class="wrap">
  <aside>
    <ol class="steps" id="steps"></ol>
    <div class="parts" id="parts" hidden></div>
    <div class="params" id="params"></div>
  </aside>
  <main id="main">
    <div class="empty" id="empty">Open a photo or scan of a drawing (or drop it here).<br>Then go through the steps on the left: clean up and trace the whole character first, then split it into parts.</div>
    <div id="view" hidden><canvas id="cv"></canvas></div>
    <div id="status"></div>
    <div id="zoombar" hidden><button id="zOut" title="Zoom out (-)">−</button><button id="zFit" title="Fit to the view (0)">100%</button><button id="zIn" title="Zoom in (=)">+</button></div>
  </main>
</div>
<div id="brushCursor"></div>
<script>
'use strict';
// ====================================================================
// Settings. Each parameter knows which pipeline stage it invalidates.
// Stages: 0 source, 1 paper, 2 ink, 3 fill, 4 solid, 5 strokes, 6 parts (7 = view only)
// ====================================================================
const DEFAULTS = {
  rotate: 0, crop: null, maxSize: 900,
  // Tuned on the artist's pencil photos: clean, smooth lines rather than a copy of every pencil wobble.
  bgOn: true, bgClose: 30, bgBlur: 150,
  lo: 20, hi: 60, cut: 0.35, speck: 20,   // lo and hi at these values mean "not set yet": auto levels runs on load
  fillClose: 10, fillOpen: 0,
  lineBlur: 0.5, lineT: 0.15, minLen: 7, burrLen: 5, smooth: 6, simplify: 3, widthScale: 1, overlapLen: 6.5, joinGap: 3, joinAngle: 40, solidK: 2.2, solidMin: 5, solidDepth: 1, solidClose: 1.5, fillSmooth: 4.5,
  boilAmp: 0.9, boilFps: 4, boilPoses: 6,
  edits: [],   // brush edits: {layer:'ink'|'fill', mode:'add'|'erase', r, pts:[[x,y]...]} in rotated-source pixels
  // line edits on the strokes step, in rotated-source pixels: {from: the traced line it replaces, nodes:
  // [{p, i, o}] cubic bezier anchors with in and out handles, closed} or {from, del: true} for a deleted line
  curves: [],
};
let S = structuredClone(DEFAULTS);   // one set of settings for the whole character
// Parts split the traced character. marks: {kind:'lasso', pts} regions and {kind:'fill', mode, r, pts} paper brush
// strokes, in rotated-source pixels. Pixels outside every lasso belong to the first part.
const newPart = (id, z) => ({ id, z, pivot: null, marks: [] });
let CH = { parts: [newPart('body', 0)] }, cur = 0;   // the character being traced
const PART_COLORS = ['#d9822b', '#3f7ab8', '#5f9e3a', '#b8487a', '#8a62c4', '#2b9c94', '#c4a92b', '#a0522d'];
const partColor = (i) => PART_COLORS[i % PART_COLORS.length];
const PART = () => CH.parts[cur];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const STEPS = [
  { id: 'source', name: 'Source', stage: 0, help: 'Rotate the page and drag a box around ONE character. Everything after works on that box.',
    params: [['rotate', 'Rotate', 'rot'], ['maxSize', 'Working size (px, long side)', 300, 1600, 50, 0]] },
  { id: 'paper', name: 'Paper', stage: 1, help: 'Removes uneven lighting and paper colour. The view should look like even white paper with grey lines.',
    params: [['bgOn', 'Flatten lighting', 'bool', 1], ['bgClose', 'Line removal size', 1, 60, 1, 1, 'Larger than the thickest line. Too small leaves lines in the light estimate.'], ['bgBlur', 'Lighting smoothness', 5, 300, 1, 1]] },
  { id: 'ink', name: 'Ink', stage: 2, brush: 'ink', help: 'Picks which pixels are pencil. Paint with the brush to add missed lines or erase smudges, specks and stray marks.',
    params: [['lo', 'Paper level (below = paper)', 0, 120, 1, 2], ['hi', 'Full ink level', 1, 200, 1, 2], ['cut', 'Line cut-off', 0.05, 0.9, 0.01, 2], ['speck', 'Remove specks smaller than (px)', 0, 400, 1, 2], ['auto', 'Auto levels', 'btn']] },
  { id: 'fill', name: 'Paper fill', stage: 3, brush: 'fill', help: 'The white cutout under the drawing. Raise gap closing if it leaks inside, or paint/erase the fill directly. Erasing fill never removes the ink lines under it.',
    params: [['fillClose', 'Gap closing (px)', 1, 60, 1, 3], ['fillOpen', 'Trim thin bits (px)', 0, 10, 1, 3]] },
  { id: 'solid', name: 'Solid ink', stage: 4, brush: 'solid', help: 'Areas coloured in solid (shoes, ear insides, a nose) become filled shapes, decided here before any strokes are traced. Shown in orange. Paint or erase to fix them.',
    params: [['solidK', 'Solid if thicker than × line', 1.2, 6, 0.1, 4, 'Lower finds more solid areas; higher only the boldest.'], ['solidDepth', 'Must be this much thicker than the cut-off × line', 0, 4, 0.1, 4, 'Rejects thick junctions and doubled lines.'], ['solidMin', 'Ignore solid areas smaller than × line', 1, 20, 0.5, 4], ['solidClose', 'Fill pencil gaps inside solids (px)', 0, 6, 0.5, 4]] },
  { id: 'strokes', name: 'Strokes', stage: 5, help: 'Traces the remaining lines as centerline strokes, all the same width. Where two strokes would lie on top of each other, the shorter one is cut back, and pieces of one line that meet or carry on in the same direction are joined into one stroke. With the photo underneath, strokes are blue. Click a line to reshape it as a bezier curve; your line edits stay when you change the sliders.',
    params: [['lineBlur', 'Merge pencil grain', 0, 4, 0.1, 5], ['lineT', 'Line threshold', 0.05, 0.6, 0.01, 5], ['widthScale', 'Line width (× drawn line)', 0.4, 3, 0.05, 5], ['overlapLen', 'Remove doubled lines longer than × width', 1, 15, 0.5, 5, 'Where two strokes run side by side for longer than this, the shorter is cut.'], ['joinGap', 'Join line ends closer than × width', 0, 10, 0.5, 5, 'Where one line stops and another carries on in the same direction, they become one stroke.'], ['joinAngle', 'Join only if the line turns less than (°)', 5, 90, 1, 5], ['minLen', 'Drop strokes shorter than', 0, 60, 1, 5], ['burrLen', 'Remove burrs shorter than × width', 0, 12, 0.5, 5, 'A short stroke that sticks out of, or runs along, a longer line is a burr from a ragged pencil line.'], ['smooth', 'Smoothing', 0, 8, 0.1, 5], ['simplify', 'Simplify', 0.1, 6, 0.05, 5], ['fillSmooth', 'Fill outline smoothing', 0, 8, 0.5, 5], ['overlay', 'Show photo underneath', 'view'], ['curve', '', 'curve']] },
  { id: 'parts', name: 'Parts', stage: 6, help: 'Splits the clean drawing into parts that move on their own. Draw a lasso around each part; anything outside every lasso belongs to the first part, and a stroke that crosses a lasso is cut there. Where a part covers another, paint extra paper fill under it with the fill brush, so no hole shows when it moves.',
    params: [['parttools', '', 'parttools']] },
  { id: 'boil', name: 'Boil & export', stage: 6, help: 'Each stroke is redrawn per pose with its own wobble, as the game will bake it. Set each part\'s pivot, then export the whole character.',
    params: [['boilAmp', 'Boil strength', 0, 4, 0.1, 7], ['boilFps', 'Frames per second', 2, 24, 1, 7], ['boilPoses', 'Poses in cycle', 2, 6, 1, 7], ['pivot', '', 'pivot'], ['export', '', 'export']] },
];
const STAGE_OF = {};
for (const st of STEPS) for (const p of st.params) if (typeof p[2] === 'number') STAGE_OF[p[0]] = p[5]; else if (p[2] === 'bool') STAGE_OF[p[0]] = p[3];
STAGE_OF.rotate = 0;

// ====================================================================
// Image helpers (plain JS, no libraries)
// ====================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function slideExtreme(src, w, h, r, isMax) { // separable square max/min filter, monotonic deque, O(n)
  if (r < 1) return src.slice();
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const q = new Int32Array(Math.max(w, h) + 2 * r + 2);
  const better = isMax ? (a, b) => a >= b : (a, b) => a <= b;
  const pass = (inp, outp, n, m, stride, step) => {
    for (let j = 0; j < m; j++) {
      const base = j * stride;
      let head = 0, tail = 0;
      for (let i = -r; i < n; i++) {
        const k = i + r;
        if (k < n) {
          const v = inp[base + k * step];
          while (tail > head && better(v, inp[base + q[tail - 1] * step])) tail--;
          q[tail++] = k;
        }
        if (q[head] < i - r) head++;
        if (i >= 0) outp[base + i * step] = inp[base + q[head] * step];
      }
    }
  };
  pass(src, tmp, w, h, w, 1);
  pass(tmp, out, h, w, 1, w);
  return out;
}

function boxBlur(src, w, h, r) {
  r = Math.round(r);
  if (r < 1) return src.slice();
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const pass = (inp, outp, n, m, stride, step) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < m; j++) {
      const b = j * stride;
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += inp[b + clamp(k, 0, n - 1) * step];
      for (let i = 0; i < n; i++) {
        outp[b + i * step] = acc * inv;
        acc += inp[b + clamp(i + r + 1, 0, n - 1) * step] - inp[b + clamp(i - r, 0, n - 1) * step];
      }
    }
  };
  pass(src, tmp, w, h, w, 1);
  pass(tmp, out, h, w, 1, w);
  return out;
}
function gauss(src, w, h, sigma) { // three box passes ~ gaussian
  if (sigma <= 0.3) return src.slice();
  const r = Math.max(1, Math.round(Math.sqrt((12 * sigma * sigma) / 3 + 1) / 2 - 0.5 + 0.5));
  return boxBlur(boxBlur(boxBlur(src, w, h, r), w, h, r), w, h, r);
}

// Exact Euclidean distance transform (Felzenszwalb). Returns distance from each pixel to the nearest pixel where mask==0.
function edt(mask, w, h) {
  const INF = 1e20, f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
  const v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1);
  const g = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = mask[i] ? INF : 0;
  const tr = (n) => {
    let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  };
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; tr(h); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; tr(w); for (let x = 0; x < w; x++) g[y * w + x] = d[x]; }
  const out = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) out[i] = Math.sqrt(g[i]);
  return out;
}
const not = (m) => { const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = m[i] ? 0 : 1; return o; };
function dilate(m, w, h, r) { if (r <= 0) return m.slice(); const d = edt(not(m), w, h); const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = d[i] <= r ? 1 : 0; return o; }
function erode(m, w, h, r) { if (r <= 0) return m.slice(); const d = edt(m, w, h); const o = new Uint8Array(m.length); for (let i = 0; i < m.length; i++) o[i] = d[i] > r ? 1 : 0; return o; }

function components(m, w, h) { // 8-connected labels and areas
  const lab = new Int32Array(w * h), areas = [0], stack = new Int32Array(w * h);
  let n = 0;
  for (let i = 0; i < w * h; i++) {
    if (!m[i] || lab[i]) continue;
    n++; let sp = 0, a = 0; stack[sp++] = i; lab[i] = n;
    while (sp) {
      const p = stack[--sp]; a++;
      const x = p % w, y = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (m[q] && !lab[q]) { lab[q] = n; stack[sp++] = q; }
      }
    }
    areas.push(a);
  }
  return { lab, areas, n };
}
function dropSmall(m, w, h, minA) {
  if (minA <= 1) return m.slice();
  const { lab, areas } = components(m, w, h);
  const o = new Uint8Array(m.length);
  for (let i = 0; i < m.length; i++) o[i] = lab[i] && areas[lab[i]] >= minA ? 1 : 0;
  return o;
}
function outsideFlood(blocked, w, h) { // pixels reachable from the border without crossing `blocked`
  const out = new Uint8Array(w * h), st = new Int32Array(w * h); let sp = 0;
  const push = (p) => { if (!blocked[p] && !out[p]) { out[p] = 1; st[sp++] = p; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const p = st[--sp], x = p % w, y = (p / w) | 0;
    if (x > 0) push(p - 1); if (x < w - 1) push(p + 1); if (y > 0) push(p - w); if (y < h - 1) push(p + w);
  }
  return out;
}

function thin(m, w, h) { // Zhang-Suen thinning
  const s = m.slice();
  for (let x = 0; x < w; x++) { s[x] = 0; s[(h - 1) * w + x] = 0; }
  for (let y = 0; y < h; y++) { s[y * w] = 0; s[y * w + w - 1] = 0; }
  const del = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (let iter = 0; iter < 2; iter++) {
      del.length = 0;
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x; if (!s[i]) continue;
        const p2 = s[i - w], p3 = s[i - w + 1], p4 = s[i + 1], p5 = s[i + w + 1], p6 = s[i + w], p7 = s[i + w - 1], p8 = s[i - 1], p9 = s[i - w - 1];
        const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
        if (B < 2 || B > 6) continue;
        const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (A !== 1) continue;
        if (iter === 0 ? (p2 * p4 * p6 || p4 * p6 * p8) : (p2 * p4 * p8 || p2 * p6 * p8)) continue;
        del.push(i);
      }
      for (const i of del) s[i] = 0;
      if (del.length) changed = true;
    }
  }
  return s;
}

// Skeleton -> polylines (node to node, plus closed loops)
function skeletonPaths(sk, w, h) {
  const NB = [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1];
  const nbrs = (p) => { const o = []; for (const d of NB) if (sk[p + d]) o.push(p + d); return o; };
  const deg = new Map(), nodes = new Set();
  for (let i = 0; i < w * h; i++) if (sk[i]) { const d = nbrs(i).length; deg.set(i, d); if (d !== 2) nodes.add(i); }
  const used = new Set();
  const key = (a, b) => (a < b ? a * 4194304 + b : b * 4194304 + a);
  const paths = [];
  const walk = (start, nxt) => {
    const path = [start, nxt]; used.add(key(start, nxt));
    let prev = start, cur = nxt;
    while (!nodes.has(cur)) {
      const cand = nbrs(cur).filter((q) => q !== prev && !used.has(key(cur, q)));
      if (!cand.length) break;
      cand.sort((a, b) => Math.abs(a - cur) === 1 || Math.abs(a - cur) === w ? -1 : 1);
      const q = cand[0]; used.add(key(cur, q)); path.push(q); prev = cur; cur = q;
      if (cur === start) break;
    }
    return path;
  };
  for (const n of nodes) for (const q of nbrs(n)) if (!used.has(key(n, q))) paths.push(walk(n, q));
  for (const p of deg.keys()) for (const q of nbrs(p)) if (!used.has(key(p, q))) { nodes.add(p); paths.push(walk(p, q)); nodes.delete(p); }
  return { paths: paths.map((p) => p.map((i) => [i % w, (i / w) | 0])), deg: (x, y) => deg.get(y * w + x) || 0 };

    S.crop = [Math.min(drag.x0, x1), Math.min(drag.y0, y1), Math.abs(x1 - drag.x0), Math.abs(y1 - drag.y0)];

  else { drag.e.pts.push(toSrc(x, y)); changed(LAYER_STAGE[drag.e.layer]); }

const endDrag = () => {
  if (drag && drag.kind === 'crop' && (!S.crop || S.crop[2] < 8 || S.crop[3] < 8)) S.crop = null;
  const lasso = drag && drag.kind === 'lasso' ? drag : null;
  drag = null;
  if (lasso) {

cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { cursor.style.display = 'none'; });

// ---- zoom and pan. Pinch or Ctrl/⌘-scroll zooms at the pointer (a mouse wheel zooms too); two-finger
// scroll pans; Space-drag or middle-drag pans. Pointer positions go through getBoundingClientRect, so every
// tool keeps working while zoomed.
let zoom = 1, panX = 0, panY = 0, spaceDown = false, pan = null;
function applyZoom() {
  $('view').style.transform = zoom === 1 ? '' : `translate(${panX.toFixed(1)}px,${panY.toFixed(1)}px) scale(${zoom})`;
  $('zFit').textContent = Math.round(zoom * 100) + '%';

}
function resetZoom() { zoom = 1; panX = panY = 0; applyZoom(); }
function zoomAt(z, cx, cy) {

const mainCentre = () => { const r = $('main').getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
$('zIn').onclick = () => zoomAt(zoom * 1.5, ...mainCentre());
$('zOut').onclick = () => zoomAt(zoom / 1.5, ...mainCentre());
$('zFit').onclick = resetZoom;
$('main').addEventListener('wheel', (ev) => {
  if (!img) return;
  ev.preventDefault();
  // A trackpad pinch arrives as Ctrl+wheel with small steps; a mouse wheel as one big vertical step per notch.
  if (ev.ctrlKey || ev.metaKey) zoomAt(zoom * Math.exp(-clamp(ev.deltaY, -50, 50) * 0.01), ev.clientX, ev.clientY);
  else if (!ev.deltaX && (ev.deltaMode === 1 || Math.abs(ev.deltaY) >= 50)) zoomAt(zoom * (ev.deltaY < 0 ? 1.25 : 0.8), ev.clientX, ev.clientY);
  else if (zoom > 1) { panX -= ev.deltaX; panY -= ev.deltaY; applyZoom(); }
}, { passive: false });
$('main').addEventListener('pointerdown', (ev) => { // capture phase: a pan never reaches the drawing tools
  if (!img || !(spaceDown || ev.button === 1)) return;
  ev.preventDefault(); ev.stopPropagation();
  try { $('main').setPointerCapture(ev.pointerId); } catch { /* not an active pointer */ }
  pan = { x: ev.clientX, y: ev.clientY, px: panX, py: panY };
}, true);
$('main').addEventListener('pointermove', (ev) => { if (!pan) return; panX = pan.px + ev.clientX - pan.x; panY = pan.py + ev.clientY - pan.y; if (zoom > 1) applyZoom(); });
const endPan = () => { pan = null; };
$('main').addEventListener('pointerup', endPan); $('main').addEventListener('pointercancel', endPan);
const typing = (t) => t && ((t.tagName === 'INPUT' && (t.type === 'text' || t.type === 'number')) || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
window.addEventListener('keydown', (ev) => {
  if (!img || typing(ev.target) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === ' ') { ev.preventDefault(); if (!spaceDown) { spaceDown = true; $('main').classList.add('panning'); } }
  else if (ev.key === '=' || ev.key === '+') zoomAt(zoom * 1.5, ...mainCentre());
  else if (ev.key === '-') zoomAt(zoom / 1.5, ...mainCentre());
  else if (ev.key === '0') resetZoom();
});
window.addEventListener('keyup', (ev) => { if (ev.key === ' ') { if (img && !typing(ev.target)) ev.preventDefault(); spaceDown = false; $('main').classList.remove('panning'); } });   // no button click on Space
$('main').addEventListener('mousedown', (ev) => { if (ev.button === 1) ev.preventDefault(); });   // no auto-scroll on middle-drag
window.addEventListener('blur', () => { spaceDown = false; $('main').classList.remove('panning'); });

// ---- line editor on the strokes step: click a line, then drag its bezier anchors and handles
let sel = null;   // {ci} for an edited line (index into S.curves), or {ci: -1, line, nodes, closed} for a traced one
const curveUndo = [], curveRedo = [];
const pxToWork = () => { const r = cv.getBoundingClientRect(); return r.width ? cv.width / r.width : 1; };
const selNodes = () => (sel.ci >= 0 ? S.curves[sel.ci].nodes.map(nodeToWork) : sel.nodes);
const selClosed = () => (sel.ci >= 0 ? S.curves[sel.ci].closed : sel.closed);
const srcLine = (pts) => fmt(rdp(pts, 0.5).map((pt) => toSrc(...pt)));
function pushCurveUndo() { curveUndo.push(JSON.stringify(S.curves)); curveRedo.length = 0; }
function curveHistory(undo) {
  const from = undo ? curveUndo : curveRedo, to = undo ? curveRedo : curveUndo;
  if (!from.length) { status(undo ? 'Nothing to undo' : 'Nothing to redo'); return; }
  to.push(JSON.stringify(S.curves)); S.curves = JSON.parse(from.pop());
  if (sel && (sel.ci >= S.curves.length || (sel.ci >= 0 && S.curves[sel.ci].del))) sel = null;
  curvesChanged(undo ? 'Undid line edit' : 'Redid line edit');
}
function curvesChanged(msg) {
  if (valid >= 5) { applyCurves(); invalidate(6); }
  renderParams(); draw(); if (msg) status(msg);
}
function setSelNodes(nodes) { // store the edited nodes (working pixels); the first edit turns a traced line into a curve
  if (sel.ci < 0) { S.curves.push({ from: srcLine(sel.line.pts), nodes: [], closed: sel.closed }); sel = { ci: S.curves.length - 1 }; }
  S.curves[sel.ci].nodes = nodes.map(nodeToSrc).map((n) => ({ p: fmt([n.p])[0], i: fmt([n.i])[0], o: fmt([n.o])[0] }));
}
function deleteSelected() {
  if (!sel) return;
  pushCurveUndo();
  if (sel.ci >= 0) S.curves[sel.ci] = { from: S.curves[sel.ci].from, del: true };
  else S.curves.push({ from: srcLine(sel.line.pts), del: true });
  sel = null; curvesChanged('Line deleted');
}
const distSeg = (p, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy, t = L ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L, 0, 1) : 0; return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); };
function curveDown(x, y, ev) {
  const R = 8 * pxToWork();
  if (sel) { // grab a handle or anchor of the selected line
    const nodes = selNodes(), closed = selClosed();
    let hit = null;
    nodes.forEach((n, k) => { for (const part of ['i', 'o']) { if (!closed && ((part === 'i' && k === 0) || (part === 'o' && k === nodes.length - 1))) continue; const d = Math.hypot(n[part][0] - x, n[part][1] - y); if (d < R && (!hit || d < hit.d)) hit = { k, part, d }; } });
    nodes.forEach((n, k) => { const d = Math.hypot(n.p[0] - x, n.p[1] - y); if (d < R && (!hit || hit.part !== 'p' || d < hit.d)) hit = { k, part: 'p', d }; });
    if (hit) {
      pushCurveUndo();
      if (hit.part === 'p' && ev.altKey) { // Alt-click an anchor: remove it
        if (nodes.length > 2) { nodes.splice(hit.k, 1); setSelNodes(nodes); curvesChanged('Anchor removed'); } else curveUndo.pop();
        return;
      }
      drag = { kind: 'node', k: hit.k, part: hit.part, nodes, x0: x, y0: y, base: JSON.parse(JSON.stringify(nodes)) };
      return;
    }
  }
  // otherwise select the line under the pointer, or nothing
  let best = -1, bd = Math.max(W.fig.width * 1.5, 10 * pxToWork());
  W.lines.forEach((l, k) => { for (let i = 1; i < l.pts.length; i++) { const d = distSeg([x, y], l.pts[i - 1], l.pts[i]); if (d < bd) { bd = d; best = k; } } });
  if (best < 0) sel = null;
  else { const l = W.lines[best]; sel = l.curve != null ? { ci: l.curve } : { ci: -1, line: l, nodes: fitNodes(l.pts, l.closed, Math.max(W.fig.width, 2)), closed: l.closed }; }
  renderParams(); draw();
}
let curveFrame = 0;
function curveMove(x, y, ev) {
  const { k, part, nodes, base } = drag, n = nodes[k], b = base[k], dx = x - drag.x0, dy = y - drag.y0;
  if (part === 'p') { for (const q of ['p', 'i', 'o']) n[q] = [b[q][0] + dx, b[q][1] + dy]; }
  else {
    n[part] = [b[part][0] + dx, b[part][1] + dy];

  const [x, y] = canvasXY(ev), nodes = selNodes(), closed = selClosed();
  let best = null;

  const a = nodes[best.s], b = nodes[(best.s + 1) % nodes.length], t = best.t, L = (u, v) => [u[0] + (v[0] - u[0]) * t, u[1] + (v[1] - u[1]) * t];

window.addEventListener('keydown', (ev) => {

  let h = `<path d="${curvePath(nodes, closed)}" fill="none" stroke="${col}" stroke-width="${f(W.fig.width)}" stroke-linecap="round" opacity=".85"/>`;

    for (const part of ['i', 'o']) {
      if (!closed && ((part === 'i' && i === 0) || (part === 'o' && i === nodes.length - 1))) continue;

function curvePanel() {
  const n = S.curves.length, edits = n ? ` · ${n} line edit(s) kept through re-tracing` : '';
  const help = sel
    ? 'Drag a square to move an anchor, a circle to bend the line. Alt-drag a circle for a sharp corner, Alt-click a square to remove it, double-click the line to add one. Delete removes the line, Esc deselects.'
    : 'Click a line to edit its curve.';
  return `<div class="p"><label>Line editor<output>${sel ? (sel.ci >= 0 ? 'edited line' : 'traced line') : ''}</output></label><span class="hint">${help}${edits}</span>
    <div class="row"><button id="cReset" ${sel && sel.ci >= 0 ? '' : 'disabled'}>Reset line</button><button id="cDelete" ${sel ? '' : 'disabled'}>Delete line</button><button id="cUndo" title="Undo (⌘Z / Ctrl+Z)">Undo</button><button id="cRedo" title="Redo (⌘⇧Z / Ctrl+Shift+Z)">Redo</button><button id="cClear" ${n ? '' : 'disabled'}>Reset all lines</button></div></div>`;

// ---- loading
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    img = im; $('empty').hidden = true; $('view').hidden = false; $('zoombar').hidden = false; sel = null; resetZoom();
    if (!$('presetName').value) $('presetName').value = f.name.replace(/\.[^.]+$/, '');
    valid = -1;
    if (!S.crop && S.lo === DEFAULTS.lo && S.hi === DEFAULTS.hi) { ensure(1); autoLevels(); }
    invalidate(0); renderParams(); draw();
  };
  im.src = url;
}
$('file').onchange = () => loadFile($('file').files[0]);
$('main').addEventListener('dragover', (e) => e.preventDefault());
$('main').addEventListener('drop', (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => { const it = [...e.clipboardData.items].find((i) => i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });

// ---- characters: parts, saved in this browser, and preset files
// Preset file: { name, settings, parts: [{ id, z, pivot, marks }] }. pivot and marks are in rotated-photo pixels.
const PKEY = 'lightbox.characters';
const readSaved = () => { try { return JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch { return {}; } };
function refreshPresetList() {
  $('presetList').innerHTML = '<option value="">Load saved…</option>' + Object.keys(readSaved()).sort().map((n) => `<option>${esc(n)}</option>`).join('');
}
const presetOf = () => ({ name: $('presetName').value.trim(), settings: S, parts: CH.parts.map((p) => ({ id: p.id, z: p.z, pivot: p.pivot, marks: p.marks })) });
// Returns a note when the file is in an older format.
function applyPreset(j) {
  let settings = j.settings, parts = j.parts, note = '';
  if (parts && !settings) {   // older presets: every part had its own crop and settings
    settings = parts[0] && parts[0].settings;
    note = ' (older preset: kept the first part\'s settings; draw the part lassos again)';
  } else if (!parts && !settings) settings = j;   // oldest: a bare settings object
  S = Object.assign(structuredClone(DEFAULTS), settings);
  CH = { parts: (parts && parts.length ? parts : [{ id: 'body' }]).map((p, i) => ({ id: p.id || `part${i + 1}`, z: p.z ?? i, pivot: p.pivot || null, marks: p.marks || [] })) };
  if (j.name) $('presetName').value = j.name;
  redo.ink = []; redo.fill = []; redo.solid = []; sel = null; curveUndo.length = curveRedo.length = 0;
  invalidate(0); renderParams(); selectPart(0);
  return note;
}
$('savePreset').onclick = () => {
  const n = $('presetName').value.trim(); if (!n) { status('Type a character name first'); return; }
  const all = readSaved(); all[n] = presetOf();
  try { localStorage.setItem(PKEY, JSON.stringify(all)); status(`Saved "${n}" in this browser`); } catch { status('This browser blocked saving; use Download preset'); }
  refreshPresetList();
};
$('presetList').onchange = () => { const n = $('presetList').value; if (!n) return; const note = applyPreset(readSaved()[n]); $('presetName').value = n; status(`Loaded "${n}"${note}`); };
$('exportPreset').onclick = () => download(fileBase() + '.preset.json', JSON.stringify(presetOf(), null, 1), 'application/json');
$('importPresetBtn').onclick = () => $('importPreset').click();
$('importPreset').onchange = async () => {
  const f = $('importPreset').files[0]; if (!f) return;
  try { const note = applyPreset(JSON.parse(await f.text())); status(`Opened ${f.name}${note}${img ? '' : '. Now open the photo it was traced from.'}`); } catch { status('That file is not a Lightbox preset'); }
  $('importPreset').value = '';
};

function renderParts() {
  const p = PART();
  $('parts').innerHTML = `<div class="row" style="justify-content:space-between"><b>Parts</b><span class="hint">${CH.parts.length} in this character</span></div>
    <div class="tabs">${CH.parts.map((q, i) => `<button data-part="${i}" class="${i === cur ? 'cur' : ''}"><span class="sw" style="background:${partColor(i)}"></span>${esc(q.id)}</button>`).join('')}<button id="addPart" title="New part; draw its lasso on the parts step">+ Part</button></div>
    <div class="fields"><label for="partId">Id</label><input type="text" id="partId" value="${esc(p.id)}"><label for="partZ">Order</label><input type="number" id="partZ" value="${p.z}" step="1" title="Draw order; higher is drawn on top"></div>
    ${CH.parts.length > 1 ? '<div class="row"><button id="delPart">Remove this part</button></div>' : ''}`;
  $('parts').querySelectorAll('[data-part]').forEach((b) => b.onclick = () => selectPart(+b.dataset.part));
  $('addPart').onclick = () => {
    let n = CH.parts.length + 1; while (CH.parts.some((q) => q.id === `part${n}`)) n++;
    CH.parts.push(newPart(`part${n}`, Math.max(...CH.parts.map((q) => q.z)) + 1));
    invalidate(6); selectPart(CH.parts.length - 1);
  };
  $('partId').onchange = () => {
    const v = $('partId').value.trim().replace(/[^\w-]+/g, '_');
    if (!v || CH.parts.some((q, i) => i !== cur && q.id === v)) { status('Part ids must be unique and not empty'); $('partId').value = p.id; return; }
    p.id = v; renderParts(); renderParams(); draw();
  };
  $('partZ').onchange = () => { p.z = Math.round(+$('partZ').value) || 0; changed(6); };
  const del = $('delPart'); if (del) del.onclick = () => { CH.parts.splice(cur, 1); invalidate(6); selectPart(Math.max(0, cur - 1)); };
}
function selectPart(i) {
  cur = i; partRedo.length = 0; pivotMode = false;
  renderParts(); renderParams(); draw();
}

// Every part in one coordinate space: photo pixels, with the crop's top-left corner at 0,0.
function buildCharacter() {
  if (!img) throw new Error('Open the photo first');
  ensure(6);
  const { scale: sc, cx, cy, cw, ch } = W, r = (v) => Math.round(v * 10) / 10, m = ([x, y]) => [r(x / sc), r(y / sc)];

  if (empty) throw new Error(`Part "${empty.id}" is empty: draw its lasso on the parts step, or remove it`);

    name: $('presetName').value.trim() || 'character', size: [cw, ch],
    parts: byZ().map((i) => {
      const p = CH.parts[i], f = W.parts[i], [px, py] = partPivot(i);
      return { id: p.id, pivot: [r(px - cx), r(py - cy)], z: p.z, paper: f.paper.map((l) => l.map(m)), solid: f.solid.map((l) => l.map(m)), strokes: f.strokes.map((st) => ({ pts: st.pts.map(m), closed: st.closed })), width: r(f.width / sc) };
    }),

}

refreshPresetList(); renderParts(); renderSteps(); renderParams();
window.__lightbox = { get S() { return S; }, get CH() { return CH; }, W, ensure, loadFile, buildCharacter, selectPart, setStep: (i) => { step = i; renderSteps(); renderParams(); draw(); } };
</script>
