name: Smoke

# Loads the game in headless Chromium and fails on any console error, page
# error or failed request. The Ubuntu runner has no GPU, but Chromium with
# --enable-unsafe-webgpu finds a software adapter there, so CI plays a few
# seconds of a run on the CPU rather than checking the "Cannot start" screen.
# The wasm is not committed, so it is built first (decision 0007).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Build the wasm
        run: ./build.sh
      - run: npm run smoke
