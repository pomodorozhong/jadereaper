name: Smoke

# Loads the game in headless Chromium and fails on any console error, page
# error or failed request. The Ubuntu runner has no GPU, but Chromium with
# --enable-unsafe-webgpu finds a software adapter there, so CI plays a few
# seconds of a run on the CPU rather than checking the "Cannot start" screen.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
