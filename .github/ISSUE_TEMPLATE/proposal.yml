name: Proposal
description: Suggest a change or a new idea
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/pomodorozhong/jadereaper/blob/main/CONTRIBUTING.md) first. Please wait for the `accepted` label before opening a PR for this.
  - type: textarea
    id: what
    attributes:
      label: What to change
      description: The idea in a sentence or two. It can be rough; details get worked out on the issue.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or what it would add to the game.
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: Anything that helps picture it, such as links, screenshots, similar games or related issues.
