name: Bug
description: Something in the game or the tools does not work as it should
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and version, operating system, and whether it was the online build or a local one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Optional. Paste errors from the browser console, if any.
